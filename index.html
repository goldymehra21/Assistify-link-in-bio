<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistify | Cosmic-Mech Red-Blue Void</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-deep: #030108;
            --text-main: #f8fafc;
            --accent-red: #ff0055;
            --accent-blue: #00d2ff;
            --accent-deep-blue: #0044ff;
            /* Completely Transparent Background Palette */
            --glass-card: transparent; 
            --glass-border: rgba(255, 0, 85, 0.5);
            --metal-gradient: rgba(255, 255, 255, 0.03);
            --dual-gradient: linear-gradient(135deg, var(--accent-red), var(--accent-deep-blue));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Background Canvas Layer */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Fully Transparent Cyber HUD Card */
        .cyber-card {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 460px;
            margin: 40px auto;
            padding: 42px 26px;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 
                0 0 30px rgba(255, 0, 85, 0.25),
                0 0 60px rgba(0, 210, 255, 0.2),
                inset 0 0 15px rgba(255, 255, 255, 0.05);
            text-align: center;
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Sci-Fi HUD Corner Brackets */
        .cyber-card::before, .cyber-card::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        .cyber-card::before {
            top: 12px; left: 12px;
            border-top: 2px solid var(--accent-red);
            border-left: 2px solid var(--accent-red);
        }
        .cyber-card::after {
            bottom: 12px; right: 12px;
            border-bottom: 2px solid var(--accent-blue);
            border-right: 2px solid var(--accent-blue);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Mech Avatar with Dual Red/Blue Energy Orbit */
        .avatar-wrapper {
            position: relative;
            width: 128px;
            height: 128px;
            margin: 0 auto 22px;
        }

        .avatar-ring-red {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 144px;
            height: 144px;
            border-radius: 50%;
            border: 2px dashed var(--accent-red);
            animation: spinClockwise 16s linear infinite;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        .avatar-ring-blue {
            position: absolute;
            top: -4px;
            left: -4px;
            width: 136px;
            height: 136px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent-blue);
            border-bottom-color: var(--accent-deep-red);
            animation: spinCounter 10s linear infinite;
        }

        @keyframes spinClockwise {
            20% { transform: rotate(360deg); }
        }
        @keyframes spinCounter {
            20% { transform: rotate(-360deg); }
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-blue);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.5);
        }

        /* Header & Neon Branding */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .robot-icon {
            font-size: 26px;
            background: var(--dual-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px var(--accent-red));
        }

        h1 {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-red) 50%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 12px;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.7);
        }

        .bio {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 26px;
            line-height: 1.5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* Social Icons */
        .social-grid {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 0, 85, 0.4);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-link:hover {
            color: #ffffff;
            border-color: var(--accent-blue);
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 5px 25px rgba(0, 210, 255, 0.5);
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.45), rgba(0, 68, 255, 0.45));
        }

        /* Fully Transparent Link Buttons */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
        }

        .mecha-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid rgba(0, 210, 255, 0.35);
            transition: all 0.3s ease;
            overflow: hidden;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .mecha-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-red);
            transition: all 0.3s ease;
        }

        .mecha-btn:hover {
            border-color: var(--accent-red);
            transform: translateX(4px) translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 0, 85, 0.35);
            background: rgba(255, 0, 85, 0.1);
        }

        .mecha-btn:hover::before {
            width: 100%;
            background: var(--dual-gradient);
            opacity: 0.2;
        }

        .btn-tag {
            font-size: 10px;
            padding: 4px 8px;
            background: rgba(255, 0, 85, 0.25);
            border: 1px solid var(--accent-red);
            color: #ff6699;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .mecha-btn:hover .btn-tag {
            background: rgba(0, 210, 255, 0.25);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* Fully Transparent Contact Box */
        .contact-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 22px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 85, 0.3);
            text-align: left;
            position: relative;
        }

        .contact-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            color: var(--accent-red);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.5);
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .input-field::placeholder {
            color: #94a3b8;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
        }

        textarea.input-field {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--dual-gradient);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.4);
        }

        .submit-btn:hover {
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.6);
            transform: translateY(-2px);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas Layer -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Main Content Card -->
    <div class="cyber-card">
        
        <!-- Profile Pic with Dual Red & Blue Rings -->
        <div class="avatar-wrapper">
            <div class="avatar-ring-red"></div>
            <div class="avatar-ring-blue"></div>
            <img src="https://via.placeholder.com/128" alt="Assistify Profile" class="profile-pic">
        </div>
        
        <!-- Header & Branding -->
        <div class="brand-header">
            <i class="fa-solid fa-robot robot-icon"></i>
            <h1>ASSISTIFY</h1>
        </div>
        <div class="subtitle">Red-Blue Cosmic Void</div>
        <p class="bio">Exploring Multiverse Storytelling, Sci-Fi Visuals & Mecha Universes</p>
        
        <!-- Social Links -->
        <div class="social-grid">
            <a href="#" class="social-link" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-link" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="#" class="social-link" aria-label="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
            <a href="#" class="social-link" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>

        <!-- Links Section -->
        <div class="links-wrapper">
            <a href="#" class="mecha-btn">
                <span>🎬 Latest Sci-Fi Cinematic</span>
                <span class="btn-tag">Watch</span>
            </a>
            <a href="#" class="mecha-btn">
                <span>📖 "Rain Between Us" Story</span>
                <span class="btn-tag">Read</span>
            </a>
            <a href="#" class="mecha-btn">
                <span>🤖 Deep Space Gallery</span>
                <span class="btn-tag">Explore</span>
            </a>
        </div>

        <!-- Contact Transmission -->
        <div class="contact-box">
            <div class="contact-title">
                <i class="fa-solid fa-satellite-dish"></i> Cosmic Transmission
            </div>
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <input type="text" name="name" class="input-field" placeholder="Commander / Name" required>
                <input type="email" name="email" class="input-field" placeholder="Sub-space Email" required>
                <textarea name="message" class="input-field" placeholder="Transmit inquiry or mission brief..." required></textarea>
                <button type="submit" class="submit-btn">Send Signal</button>
            </form>
        </div>
    </div>

    <!-- 3D Multiverse & Mech Engine Script -->
    <script>
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 1. Cosmic Spiral Galaxy (Red & Blue Universe)
        const galaxyParticleCount = 2500;
        const galaxyGeo = new THREE.BufferGeometry();
        const galaxyPositions = new Float32Array(galaxyParticleCount * 3);
        const galaxyColors = new Float32Array(galaxyParticleCount * 3);

        const colorRed = new THREE.Color(0xff0055);
        const colorBlue = new THREE.Color(0x00d2ff);
        const colorDeepBlue = new THREE.Color(0x0022ff);

        for (let i = 0; i < galaxyParticleCount; i++) {
            const i3 = i * 3;
            const radius = Math.random() * 30 + 2;
            const spinAngle = radius * 0.4;
            const branchAngle = ((i % 2) * Math.PI); 

            const randomX = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 3;
            const randomY = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 3;
            const randomZ = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 3;

            galaxyPositions[i3] = Math.cos(spinAngle + branchAngle) * radius + randomX;
            galaxyPositions[i3 + 1] = randomY;
            galaxyPositions[i3 + 2] = Math.sin(spinAngle + branchAngle) * radius + randomZ;

            let mixedColor = colorRed.clone();
            if (i % 2 === 0) {
                mixedColor.lerp(colorBlue, radius / 30);
            } else {
                mixedColor.lerp(colorDeepBlue, Math.random());
            }

            galaxyColors[i3] = mixedColor.r;
            galaxyColors[i3 + 1] = mixedColor.g;
            galaxyColors[i3 + 2] = mixedColor.b;
        }

        galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
        galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

        const galaxyMat = new THREE.PointsMaterial({
            size: 0.16,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
        galaxy.position.z = -5;
        galaxy.rotation.x = Math.PI / 5;
        scene.add(galaxy);

        // 2. Deep Space Stars (Distant Background)
        const starCount = 800;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 80;
            starPos[i + 1] = (Math.random() - 0.5) * 80;
            starPos[i + 2] = (Math.random() - 0.5) * 80;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ size: 0.08, color: 0xffffff, transparent: true, opacity: 0.6 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // 3. Central Mecha Core Reactor (Red Core + Blue Orbital Shields)
        const mechaGroup = new THREE.Group();

        const coreGeo = new THREE.IcosahedronGeometry(2.5, 0);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        mechaGroup.add(coreMesh);

        const ring1Geo = new THREE.TorusGeometry(5.5, 0.08, 16, 100);
        const ring1Mat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, wireframe: true });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        mechaGroup.add(ring1);

        const ring2Geo = new THREE.TorusGeometry(7.2, 0.06, 16, 100);
        const ring2Mat = new THREE.MeshBasicMaterial({ color: 0x0044ff, wireframe: true });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.x = Math.PI / 2.5;
        mechaGroup.add(ring2);

        scene.add(mechaGroup);

        camera.position.z = 18;

        // Interactive Parallax Tracking
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            galaxy.rotation.y = time * 0.05;
            starField.rotation.y = time * 0.01;

            coreMesh.rotation.x = time * 0.5;
            coreMesh.rotation.y = time * 0.7;

            const pulse = Math.sin(time * 3) * 0.15 + 1;
            coreMesh.scale.set(pulse, pulse, pulse);

            ring1.rotation.y = time * 0.6;
            ring1.rotation.z = time * 0.3;

            ring2.rotation.x = -time * 0.4;
            ring2.rotation.y = time * 0.5;

            mechaGroup.rotation.y += (mouseX * 0.6 - mechaGroup.rotation.y) * 0.05;
            mechaGroup.rotation.x += (mouseY * 0.6 - mechaGroup.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
