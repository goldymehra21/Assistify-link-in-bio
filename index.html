<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sci-Fi Cyberpunk Video Grid</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --neon-cyan: #66fcf1;
      --neon-magenta: #ff007f;
      --text-color: #c5c6c7;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--neon-cyan);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
    }

    /* 3 Videos in a Row Layout */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    @media (max-width: 850px) {
      .video-grid {
        grid-template-columns: 1fr; /* Stack vertically on small mobile screens */
      }
    }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--neon-cyan);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }

    .video-wrapper video,
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
    }

    .card-info {
      padding: 1rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin: 0 0 0.5rem 0;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #a4b0be;
      margin-bottom: 1rem;
    }

    .btn-fallback {
      display: inline-block;
      text-align: center;
      padding: 0.5rem 1rem;
      background: transparent;
      border: 1px solid var(--neon-magenta);
      color: var(--neon-magenta);
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-fallback:hover {
      background: var(--neon-magenta);
      color: #fff;
      box-shadow: 0 0 10px var(--neon-magenta);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Cyberpunk Video Showcase</h1>

    <!-- 3 Videos in 1 Row -->
    <div class="video-grid">

      <!-- Video 1: Verified HTML5 Native MP4 -->
      <div class="video-card">
        <div class="video-wrapper">
          <video controls preload="metadata" poster="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800">
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
        <div class="card-info">
          <div>
            <h2 class="card-title">Stream Sample A</h2>
            <p class="card-desc">Direct CORS-friendly MP4 video playback element.</p>
          </div>
          <a href="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" target="_blank" class="btn-fallback">Direct Video Link ↗</a>
        </div>
      </div>

      <!-- Video 2: Verified YouTube Embed -->
      <div class="video-card">
        <div class="video-wrapper">
          <iframe 
            src="https://www.youtube.com/embed/qIcTM8WXFjk" 
            title="Cyberpunk 2077 Trailer" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
        <div class="card-info">
          <div>
            <h2 class="card-title">Cyberpunk 2077 Trailer</h2>
            <p class="card-desc">Standard embedded YouTube video player.</p>
          </div>
          <a href="https://www.youtube.com/watch?v=qIcTM8WXFjk" target="_blank" class="btn-fallback">Watch on YouTube ↗</a>
        </div>
      </div>

      <!-- Video 3: Verified HTML5 Native MP4 -->
      <div class="video-card">
        <div class="video-wrapper">
          <video controls preload="metadata" poster="https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=800">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
        <div class="card-info">
          <div>
            <h2 class="card-title">Stream Sample B</h2>
            <p class="card-desc">Public CDN video stream for guaranteed rendering.</p>
          </div>
          <a href="https://www.w3schools.com/html/mov_bbb.mp4" target="_blank" class="btn-fallback">Direct Video Link ↗</a>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
