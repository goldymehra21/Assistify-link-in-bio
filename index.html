<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistify | Cosmic Universe Void</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-deep: #03010a;
            --text-main: #f8fafc;
            /* Universe Color Palette: Cosmic Purple, Nebula Magenta, Starlight Gold, Cosmic Cyan */
            --accent-purple: #9d4edd;
            --accent-magenta: #f72585;
            --accent-gold: #ffb703;
            --accent-cyan: #4cc9f0;
            
            /* 2% Opacity Background Palette */
            --glass-card: rgba(15, 5, 30, 0.02); 
            --glass-border: rgba(157, 78, 221, 0.35);
            --btn-bg: rgba(20, 8, 40, 0.02);
            --universe-gradient: linear-gradient(135deg, var(--accent-purple), var(--accent-magenta), var(--accent-gold));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Background Canvas Layer */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 2% Opacity Cyber HUD Card Frame */
        .cyber-card {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 460px;
            margin: 40px auto;
            padding: 42px 26px;
            background: var(--glass-card);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 
                0 0 35px rgba(157, 78, 221, 0.25),
                0 0 70px rgba(247, 37, 133, 0.18),
                inset 0 0 15px rgba(255, 255, 255, 0.02);
            text-align: center;
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Sci-Fi HUD Corner Brackets */
        .cyber-card::before, .cyber-card::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        .cyber-card::before {
            top: 12px; left: 12px;
            border-top: 2px solid var(--accent-magenta);
            border-left: 2px solid var(--accent-magenta);
        }
        .cyber-card::after {
            bottom: 12px; right: 12px;
            border-bottom: 2px solid var(--accent-purple);
            border-right: 2px solid var(--accent-purple);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Mech Avatar with Universe Nebula Rings */
        .avatar-wrapper {
            position: relative;
            width: 128px;
            height: 128px;
            margin: 0 auto 22px;
        }

        .avatar-ring-purple {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 144px;
            height: 144px;
            border-radius: 50%;
            border: 2px dashed var(--accent-purple);
            animation: spinClockwise 16s linear infinite;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
        }

        .avatar-ring-gold {
            position: absolute;
            top: -4px;
            left: -4px;
            width: 136px;
            height: 136px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent-magenta);
            border-bottom-color: var(--accent-gold);
            animation: spinCounter 10s linear infinite;
        }

        @keyframes spinClockwise {
            100% { transform: rotate(360deg); }
        }
        @keyframes spinCounter {
            100% { transform: rotate(-360deg); }
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-magenta);
            box-shadow: 0 0 25px rgba(247, 37, 133, 0.5);
        }

        /* Header & Cosmic Branding */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .robot-icon {
            font-size: 28px;
            background: var(--universe-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px var(--accent-magenta));
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2.5px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-purple) 35%, var(--accent-magenta) 70%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(157, 78, 221, 0.4));
        }

        .subtitle {
            font-size: 12px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 183, 3, 0.8);
        }

        .bio {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 26px;
            line-height: 1.5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        /* Social Icons (2% Opacity) */
        .social-grid {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(20, 8, 40, 0.02);
            border: 1px solid rgba(157, 78, 221, 0.35);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-link:hover {
            color: #ffffff;
            border-color: var(--accent-magenta);
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 5px 25px rgba(247, 37, 133, 0.5);
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.35), rgba(247, 37, 133, 0.35));
        }

        /* 2% Opacity Link Buttons */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
        }

        .mecha-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--btn-bg);
            backdrop-filter: blur(1px);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid rgba(157, 78, 221, 0.28);
            transition: all 0.3s ease;
            overflow: hidden;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
        }

        .mecha-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-purple);
            transition: all 0.3s ease;
        }

        .mecha-btn:hover {
            border-color: var(--accent-magenta);
            transform: translateX(4px) translateY(-2px);
            box-shadow: 0 8px 30px rgba(247, 37, 133, 0.35);
            background: rgba(157, 78, 221, 0.15);
        }

        .mecha-btn:hover::before {
            width: 100%;
            background: var(--universe-gradient);
            opacity: 0.18;
        }

        .btn-tag {
            font-size: 10px;
            padding: 4px 8px;
            background: rgba(157, 78, 221, 0.18);
            border: 1px solid var(--accent-purple);
            color: #d8b4fe;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .mecha-btn:hover .btn-tag {
            background: rgba(247, 37, 133, 0.25);
            border-color: var(--accent-magenta);
            color: #ff85c0;
        }

        /* 2% Opacity Contact Box */
        .contact-box {
            background: rgba(15, 5, 30, 0.02);
            backdrop-filter: blur(1px);
            padding: 22px 18px;
            border-radius: 16px;
            border: 1px solid rgba(157, 78, 221, 0.25);
            text-align: left;
            position: relative;
        }

        .contact-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            color: var(--accent-magenta);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(247, 37, 133, 0.5);
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .input-field::placeholder {
            color: #94a3b8;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-purple);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 12px rgba(157, 78, 221, 0.4);
        }

        textarea.input-field {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--universe-gradient);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(157, 78, 221, 0.4);
        }

        .submit-btn:hover {
            box-shadow: 0 6px 25px rgba(247, 37, 133, 0.6);
            transform: translateY(-2px);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas Layer -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Main Content Card -->
    <div class="cyber-card">
        
        <!-- Profile Pic with Universe Rings -->
        <div class="avatar-wrapper">
            <div class="avatar-ring-purple"></div>
            <div class="avatar-ring-gold"></div>
            <img src="https://scontent.fluh3-1.fna.fbcdn.net/v/t39.30808-6/521543755_24137827102522479_1123099469820507651_n.jpg?stp=dst-jpg_tt6&cstp=mx1037x1063&ctp=s1037x1063&_nc_cat=109&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=wPH6geCRoqsQ7kNvwHCjE9P&_nc_oc=AdpfzodmAOmb9lwXdD7z47BeqVcrKgXbKUeZeO2UotvBO9CWfO87axJlV0ycAIwYzlE&_nc_zt=23&_nc_ht=scontent.fluh3-1.fna&_nc_gid=HzRlMyZCE4vFQKN4VEgVuQ&_nc_ss=7a2a8&oh=00_AQAL2N1OqsS0khAcxAjCZgznj01x6oHzM8BIpmDjNPt29Q&oe=6A6FBD83">
        </div>
        
        <!-- Header & Branding -->
        <div class="brand-header">
            <i class="fa-solid fa-robot robot-icon"></i>
            <h1>ASSISTIFY</h1>
        </div>
        <div class="subtitle">Cosmic Nebula Void</div>
        <p class="bio">Exploring Multiverse Storytelling, Sci-Fi Visuals & Mecha Universes</p>
        
        <!-- Social Links -->
        <div class="social-grid">
            <a href="#" class="social-link" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-link" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="#" class="social-link" aria-label="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
            <a href="#" class="social-link" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>

        <!-- Links Section -->
        <div class="links-wrapper">
            <a href="#" class="mecha-btn">
                <span>🎬 Latest Sci-Fi Cinematic</span>
                <span class="btn-tag">Watch</span>
            </a>
            <a href="#" class="mecha-btn">
                <span>📖 "Rain Between Us" Story</span>
                <span class="btn-tag">Read</span>
            </a>
            <a href="#" class="mecha-btn">
                <span>🤖 Deep Space Gallery</span>
                <span class="btn-tag">Explore</span>
            </a>
        </div>

        <!-- Contact Transmission -->
        <div class="contact-box">
            <div class="contact-title">
                <i class="fa-solid fa-satellite-dish"></i> Cosmic Transmission
            </div>
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <input type="text" name="name" class="input-field" placeholder="Commander / Name" required>
                <input type="email" name="email" class="input-field" placeholder="Sub-space Email" required>
                <textarea name="message" class="input-field" placeholder="Transmit inquiry or mission brief..." required></textarea>
                <button type="submit" class="submit-btn">Send Signal</button>
            </form>
        </div>
    </div>

    <!-- 3D Multiverse, Planets & Tiny Spaceship Swarm Engine Script -->
    <script>
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 1. Cosmic Universe Lighting Setup (Magenta, Purple, Gold Highlights)
        const ambientLight = new THREE.AmbientLight(0x200b3b, 1.2);
        scene.add(ambientLight);

        const magentaLight = new THREE.PointLight(0xf72585, 4, 80);
        magentaLight.position.set(-20, 15, 10);
        scene.add(magentaLight);

        const purpleLight = new THREE.PointLight(0x9d4edd, 4, 80);
        purpleLight.position.set(20, -15, 10);
        scene.add(purpleLight);

        const goldLight = new THREE.PointLight(0xffb703, 2, 60);
        goldLight.position.set(0, 20, -10);
        scene.add(goldLight);

        // 2. Cosmic Universe Galaxy (Purple, Magenta, Gold & Cyan Particle Palette)
        const galaxyParticleCount = 3000;
        const galaxyGeo = new THREE.BufferGeometry();
        const galaxyPositions = new Float32Array(galaxyParticleCount * 3);
        const galaxyColors = new Float32Array(galaxyParticleCount * 3);

        const colorPurple = new THREE.Color(0x9d4edd);
        const colorMagenta = new THREE.Color(0xf72585);
        const colorGold = new THREE.Color(0xffb703);
        const colorCyan = new THREE.Color(0x4cc9f0);

        for (let i = 0; i < galaxyParticleCount; i++) {
            const i3 = i * 3;
            const radius = Math.random() * 32 + 2;
            const spinAngle = radius * 0.4;
            const branchAngle = ((i % 3) * (Math.PI * 2 / 3)); 

            const randomX = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 3;
            const randomY = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 3;
            const randomZ = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1)) * 3;

            galaxyPositions[i3] = Math.cos(spinAngle + branchAngle) * radius + randomX;
            galaxyPositions[i3 + 1] = randomY;
            galaxyPositions[i3 + 2] = Math.sin(spinAngle + branchAngle) * radius + randomZ;

            let mixedColor;
            const mod = i % 3;
            if (mod === 0) {
                mixedColor = colorPurple.clone().lerp(colorMagenta, radius / 32);
            } else if (mod === 1) {
                mixedColor = colorMagenta.clone().lerp(colorGold, Math.random());
            } else {
                mixedColor = colorPurple.clone().lerp(colorCyan, radius / 32);
            }

            galaxyColors[i3] = mixedColor.r;
            galaxyColors[i3 + 1] = mixedColor.g;
            galaxyColors[i3 + 2] = mixedColor.b;
        }

        galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
        galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

        const galaxyMat = new THREE.PointsMaterial({
            size: 0.16,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
        galaxy.position.z = -6;
        galaxy.rotation.x = Math.PI / 5;
        scene.add(galaxy);

        // 3. Deep Space Stars Background
        const starCount = 1200;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 95;
            starPos[i + 1] = (Math.random() - 0.5) * 95;
            starPos[i + 2] = (Math.random() - 0.5) * 95;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ size: 0.08, color: 0xffffff, transparent: true, opacity: 0.75 });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // 4. PLANETS CREATION
        // Planet 1: Ringed Cosmic Gas Giant
        const planetGroup1 = new THREE.Group();
        const planetGeo1 = new THREE.SphereGeometry(3.2, 64, 64);
        const planetMat1 = new THREE.MeshPhongMaterial({
            color: 0x1d032b,
            emissive: 0x2e003e,
            specular: 0xf72585,
            shininess: 30
        });
        const planet1 = new THREE.Mesh(planetGeo1, planetMat1);
        planetGroup1.add(planet1);

        // Planet 1 Celestial Ring
        const ringGeo = new THREE.RingGeometry(4.2, 6.5, 64);
        const ringMat = new THREE.MeshStandardMaterial({
            color: 0xffb703,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.65,
            roughness: 0.3
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.2;
        planetGroup1.add(ring);

        planetGroup1.position.set(9, -2, -8);
        scene.add(planetGroup1);

        // Planet 2: Small Deep Purple Moon
        const planetGeo2 = new THREE.SphereGeometry(1.4, 32, 32);
        const planetMat2 = new THREE.MeshPhongMaterial({
            color: 0x0a0118,
            emissive: 0x1a0033,
            specular: 0x9d4edd,
            shininess: 20
        });
        const planet2 = new THREE.Mesh(planetGeo2, planetMat2);
        planet2.position.set(-10, 6, -10);
        scene.add(planet2);

        // 5. TINY SPACESHIPS FLEET CREATION
        function createTinySpaceship(engineColorHex) {
            const shipGroup = new THREE.Group();

            // Cockpit / Fuselage
            const bodyGeo = new THREE.ConeGeometry(0.4, 2.0, 5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1c0d2e, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2;
            shipGroup.add(body);

            // Wing Structure
            const wingGeo = new THREE.BoxGeometry(2.0, 0.04, 0.7);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x10051e, metalness: 0.9 });
            const wings = new THREE.Mesh(wingGeo, wingMat);
            wings.position.z = 0.2;
            shipGroup.add(wings);

            // Tiny Engine Glow
            const engineGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.4, 12);
            const engineMat = new THREE.MeshBasicMaterial({ color: engineColorHex });
            const engine = new THREE.Mesh(engineGeo, engineMat);
            engine.rotation.x = Math.PI / 2;
            engine.position.z = 1.1;
            shipGroup.add(engine);

            // Micro scale (Tiny Ships)
            shipGroup.scale.set(0.18, 0.18, 0.18);
            return shipGroup;
        }

        // Squad of 7 tiny spaceships with universe engine glow colors
        const tinyShips = [];
        const engineColors = [0x9d4edd, 0xf72585, 0xffb703, 0x4cc9f0, 0x7209b7];

        for (let i = 0; i < 7; i++) {
            const color = engineColors[i % engineColors.length];
            const ship = createTinySpaceship(color);
            scene.add(ship);

            tinyShips.push({
                mesh: ship,
                speed: 0.25 + Math.random() * 0.35,
                radiusX: 9 + Math.random() * 8,
                radiusY: 2 + Math.random() * 5,
                radiusZ: 6 + Math.random() * 8,
                offset: Math.random() * Math.PI * 2,
                heightOffset: (Math.random() - 0.5) * 8
            });
        }

        camera.position.z = 18;

        // Interactive Parallax Tracking
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Rotate background galaxy & planets
            galaxy.rotation.y = time * 0.04;
            starField.rotation.y = time * 0.008;

            planet1.rotation.y = time * 0.1;
            planetGroup1.rotation.z = Math.sin(time * 0.2) * 0.08;
            planet2.rotation.y = time * 0.15;

            // Animate Tiny Spaceships Fleet Flight Paths
            tinyShips.forEach((item, idx) => {
                const t = time * item.speed + item.offset;
                const sign = (idx % 2 === 0) ? 1 : -1;

                item.mesh.position.x = Math.sin(t * sign) * item.radiusX;
                item.mesh.position.y = Math.cos(t * 1.3) * item.radiusY + item.heightOffset;
                item.mesh.position.z = Math.cos(t * sign) * item.radiusZ - 4;

                // Pitch & Yaw Rotations along vector
                item.mesh.rotation.y = -t * sign + (sign > 0 ? Math.PI / 2 : -Math.PI / 2);
                item.mesh.rotation.z = Math.sin(t * 2) * 0.2;
            });

            // Subtle Parallax Camera Reaction
            camera.position.x += (mouseX * 2.5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 2.5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
